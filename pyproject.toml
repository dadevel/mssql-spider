[project]
name = "mssqlmap"
version = "0.6.7"
description = ""
authors = [{name = "dadevel",email = "dadevel@disroot.org"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
packages = [{include = "mssqlmap"}]
dependencies = [
    "impacket>=0.13.1",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
mssql-discover = "mssqlmap.discover.main:main"
mssql-ping = "mssqlmap.ping:main"
mssql-spider = "mssqlmap.spider:main"
mssql-spray = "mssqlmap.spray:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.13"]
build-backend = "uv_build"
